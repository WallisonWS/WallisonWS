<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="NetGuard Audit CLI">
  <defs>
    <linearGradient id="bgN" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0d2126"/>
    </linearGradient>
    <linearGradient id="barN" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="580" height="200" rx="14" fill="url(#bgN)"/>
  <rect x="1" y="1" width="578" height="198" rx="13" fill="none" stroke="#164e4a" stroke-width="1.5"/>
  <rect x="0" y="0" width="580" height="4" rx="2" fill="url(#barN)"/>

  <!-- Pure Vector Lock/Check Icon -->
  <rect x="22" y="22" width="44" height="44" rx="10" fill="#064e3b" stroke="#10b981" stroke-opacity="0.55"/>
  <rect x="34" y="42" width="20" height="15" rx="3" fill="none" stroke="#34d399" stroke-width="2.4"/>
  <path d="M 38 42 L 38 37 C 38 33 50 33 50 37 L 50 42" fill="none" stroke="#34d399" stroke-width="2.4"/>

  <text x="80" y="42" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">NetGuard Audit CLI</text>
  <text x="80" y="61" fill="#34d399" font-family="Consolas, monospace" font-size="12" font-weight="700">Zero-Dependency TLS &amp; Secret Grader</text>

  <rect x="424" y="22" width="134" height="24" rx="12" fill="#0c4a6e" stroke="#38bdf8" stroke-opacity="0.6"/>
  <text x="491" y="38" text-anchor="middle" fill="#7dd3fc" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800">GRADE A+ TO F</text>

  <text x="22" y="98" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Grades HTTPS TLS &amp; Security Headers (A+ to F), scans Git repos for</text>
  <text x="22" y="118" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">leaked secrets, audits critical ports &amp; exports Executive HTML Reports.</text>

  <g font-family="Consolas, monospace" font-size="11" font-weight="700">
    <rect x="22" y="146" width="90" height="24" rx="6" fill="#0f292a" stroke="#1d4d4f"/>
    <text x="67" y="162" text-anchor="middle" fill="#6ee7b7">Zero Deps</text>
    <rect x="120" y="146" width="110" height="24" rx="6" fill="#0f292a" stroke="#1d4d4f"/>
    <text x="175" y="162" text-anchor="middle" fill="#7dd3fc">Secret Audit</text>
    <rect x="238" y="146" width="96" height="24" rx="6" fill="#0f292a" stroke="#1d4d4f"/>
    <text x="286" y="162" text-anchor="middle" fill="#fcd34d">HTML Report</text>
  </g>
  <text x="556" y="162" text-anchor="end" fill="#34d399" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800">Explore Auditor →</text>
