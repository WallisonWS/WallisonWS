<svg xmlns="http://www.w3.org/2000/svg" width="580" height="200" viewBox="0 0 580 200" role="img" aria-label="DevSecOps Toolkit v2">
  <defs>
    <linearGradient id="bgD" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="barD" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="580" height="200" rx="14" fill="url(#bgD)"/>
  <rect x="1" y="1" width="578" height="198" rx="13" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>
  <rect x="0" y="0" width="580" height="4" rx="2" fill="url(#barD)"/>

  <!-- Pure Vector Bolt Icon -->
  <rect x="22" y="22" width="44" height="44" rx="10" fill="#0c4a6e" stroke="#38bdf8" stroke-opacity="0.55"/>
  <polygon points="46,30 34,46 43,46 41,58 54,42 45,42" fill="#38bdf8"/>

  <text x="80" y="42" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800">DevSecOps Toolkit v2</text>
  <text x="80" y="61" fill="#38bdf8" font-family="Consolas, monospace" font-size="12" font-weight="700">12-in-1 Privacy-First Web Studio + CLI</text>

  <rect x="436" y="22" width="122" height="24" rx="12" fill="#064e3b" stroke="#10b981" stroke-opacity="0.6"/>
  <text x="497" y="38" text-anchor="middle" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" font-weight="800">LIVE • 12 TOOLS</text>

  <text x="22" y="98" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">Multi-vendor Firewall Transpiler (FortiGate, MikroTik, pfSense, AWS),</text>
  <text x="22" y="118" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="13">CIDR/VLSM, SOC Scanner, CVSS 3.1, Headers A+, Docker CIS &amp; SQL ERD.</text>

  <g font-family="Consolas, monospace" font-size="11" font-weight="700">
    <rect x="22" y="146" width="96" height="24" rx="6" fill="#172540" stroke="#263b5e"/>
    <text x="70" y="162" text-anchor="middle" fill="#7dd3fc">100% Local</text>
    <rect x="126" y="146" width="84" height="24" rx="6" fill="#172540" stroke="#263b5e"/>
    <text x="168" y="162" text-anchor="middle" fill="#a5b4fc">CVSS 3.1</text>
    <rect x="218" y="146" width="108" height="24" rx="6" fill="#172540" stroke="#263b5e"/>
    <text x="272" y="162" text-anchor="middle" fill="#6ee7b7">Docker CIS</text>
  </g>
  <text x="556" y="162" text-anchor="end" fill="#38bdf8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="800">Open Web Studio →</text>
