<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Wallison Araujo - Software Engineer, AI Security and DevSecOps Architect">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0b1222"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="accentStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <radialGradient id="glowLeft" cx="18%" cy="22%" r="50%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="86%" cy="55%" r="42%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" fill-opacity="0.5"/>
    </pattern>
    <style>
      .pulse { animation: p 2.4s ease-in-out infinite; }
      .blink { animation: b 1.1s step-end infinite; }
      @keyframes p { 0%,100%{opacity:1} 50%{opacity:0.3} }
      @keyframes b { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    </style>
  </defs>

  <!-- Background Shell -->
  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glowLeft)"/>
  <rect width="1200" height="300" rx="18" fill="url(#glowRight)"/>
  <rect x="1" y="1" width="1198" height="298" rx="17" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Top Bar -->
  <path d="M 1 18 Q 1 1 18 1 L 1182 1 Q 1199 1 1199 18 L 1199 40 L 1 40 Z" fill="#090f1d"/>
  <line x1="1" y1="40" x2="1199" y2="40" stroke="#1e293b" stroke-width="1"/>
  <circle cx="26" cy="20" r="5.5" fill="#ef4444"/>
  <circle cx="44" cy="20" r="5.5" fill="#f59e0b"/>
  <circle cx="62" cy="20" r="5.5" fill="#10b981"/>
  <text x="86" y="24" fill="#64748b" font-family="Consolas, Menlo, monospace" font-size="12.5" font-weight="600">wallison@devsecops-lab:~</text>

  <!-- Right Top Pill -->
  <rect x="926" y="9" width="250" height="22" rx="11" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-opacity="0.55"/>
  <circle class="pulse" cx="942" cy="20" r="4" fill="#10b981"/>
  <text x="954" y="24" fill="#6ee7b7" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="0.4">OPEN-SOURCE ENGINEER • LIVE</text>

  <!-- Main Left Copy (strictly bounded x=54..840 so it NEVER touches right emblem x=920..1140) -->
  <text x="54" y="108" fill="url(#nameGrad)" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.8">Wallison Araujo</text>
  <rect x="424" y="77" width="136" height="32" rx="8" fill="#172540" stroke="#38bdf8" stroke-opacity="0.5"/>
  <text x="492" y="98" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="14.5" font-weight="700">@WallisonWS</text>

  <text x="54" y="144" fill="#e2e8f0" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="19" font-weight="600">Software Engineer  •  AI Security &amp; SRE  •  Zero-Trust Architect</text>
  <text x="54" y="172" fill="#94a3b8" font-family="Segoe UI, -apple-system, Arial, sans-serif" font-size="14.5">Building zero-dependency security, SRE observability &amp; LLM defense tools for modern engineering teams.</text>

  <!-- Clean Vector Pills (No emojis that distort width) -->
  <g font-family="Consolas, monospace" font-size="12" font-weight="700">
    <rect x="54" y="194" width="166" height="28" rx="7" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.55"/>
    <text x="137" y="212" text-anchor="middle" fill="#c7d2fe">AI / OWASP LLM</text>

    <rect x="232" y="194" width="174" height="28" rx="7" fill="#0c4a6e" stroke="#38bdf8" stroke-opacity="0.55"/>
    <text x="319" y="212" text-anchor="middle" fill="#7dd3fc">SRE &amp; OSV.dev</text>

    <rect x="418" y="194" width="184" height="28" rx="7" fill="#064e3b" stroke="#10b981" stroke-opacity="0.55"/>
    <text x="510" y="212" text-anchor="middle" fill="#6ee7b7">Zero-Trust Infra</text>

    <rect x="614" y="194" width="174" height="28" rx="7" fill="#172540" stroke="#60a5fa" stroke-opacity="0.55"/>
    <text x="701" y="212" text-anchor="middle" fill="#93c5fd">Flutter / TS / Go</text>
  </g>

  <!-- Terminal Prompt -->
  <rect x="54" y="238" width="734" height="38" rx="9" fill="#050811" stroke="#1e293b" stroke-width="1.2"/>
  <text x="72" y="262" fill="#10b981" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$</text>
  <text x="90" y="262" fill="#cbd5e1" font-family="Consolas, monospace" font-size="13">aegis-guard &amp;&amp; sre-osv-sentinel &amp;&amp; devsecops-toolkit --status=online</text>
  <rect class="blink" x="642" y="249" width="8" height="16" rx="1.5" fill="#38bdf8"/>

  <!-- Right Emblem (ABSOLUTE COORDINATES — ZERO CSS transform conflict!) -->
  <circle cx="1028" cy="168" r="94" fill="#0ea5e9" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.25" stroke-dasharray="6 6"/>
  <circle cx="1028" cy="168" r="72" fill="#6366f1" fill-opacity="0.09" stroke="#818cf8" stroke-opacity="0.35"/>
  <!-- Shield Polygon centered at (1028, 168) -->
  <path d="M 1028 104 L 1082 126 L 1082 174 C 1082 208 1058 232 1028 244 C 998 232 974 208 974 174 L 974 126 Z"
        fill="#0b1326" stroke="url(#accentStroke)" stroke-width="3.5"/>
  <!-- Code Brackets </> inside Shield -->
  <path d="M 1010 158 L 996 171 L 1010 184" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 1046 158 L 1060 171 L 1046 184" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="1034" y1="152" x2="1022" y2="190" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
  <!-- Pulsing Satellite Nodes -->
  <circle class="pulse" cx="946" cy="134" r="5" fill="#38bdf8"/>
  <circle class="pulse" cx="1110" cy="202" r="5" fill="#10b981"/>
  <circle class="pulse" cx="1096" cy="112" r="4" fill="#a855f7"/>
</svg>
