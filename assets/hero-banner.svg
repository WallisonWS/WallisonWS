<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Wallison Araujo - DevSecOps, Software Engineer and Network Architect">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060a14"/>
      <stop offset="50%" stop-color="#0d1526"/>
      <stop offset="100%" stop-color="#0a1020"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="20%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowIndigo" cx="85%" cy="75%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.45"/>
    </pattern>
    <style>
      .pulse { animation: pulseAnim 2.2s ease-in-out infinite; }
      .blink { animation: blinkAnim 1.1s step-end infinite; }
      .floatShield { animation: floatAnim 4.5s ease-in-out infinite; }
      @keyframes pulseAnim { 0%,100%{opacity:1} 50%{opacity:0.35} }
      @keyframes blinkAnim { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      @keyframes floatAnim { 0%,100%{transform:translateY(0px)} 50%{transform:translateY(-6px)} }
    </style>
  </defs>

  <!-- Main Card Background -->
  <rect width="1200" height="320" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowCyan)"/>
  <rect width="1200" height="320" rx="20" fill="url(#glowIndigo)"/>
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Top Terminal Header Bar -->
  <path d="M 1 20 Q 1 1 20 1 L 1180 1 Q 1199 1 1199 20 L 1199 42 L 1 42 Z" fill="#0b1222" fill-opacity="0.9"/>
  <line x1="1" y1="42" x2="1199" y2="42" stroke="#1e293b" stroke-width="1"/>
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#10b981"/>
  <text x="92" y="26" fill="#64748b" font-family="Consolas, 'Fira Code', monospace" font-size="13" font-weight="600">wallison@devsecops-hub:~ — bash</text>

  <!-- Live Status Pill (Top Right) -->
  <rect x="920" y="10" width="256" height="24" rx="12" fill="#064e3b" fill-opacity="0.5" stroke="#10b981" stroke-opacity="0.5"/>
  <circle class="pulse" cx="937" cy="22" r="4.5" fill="#10b981"/>
  <text x="950" y="26" fill="#6ee7b7" font-family="Segoe UI, system-ui, sans-serif" font-size="11.5" font-weight="700" letter-spacing="0.5">OPEN SOURCE CREATOR • LIVE</text>

  <!-- Left Content: Identity & Headline -->
  <text x="56" y="114" fill="url(#titleGrad)" font-family="Segoe UI, -apple-system, system-ui, sans-serif" font-size="48" font-weight="800" letter-spacing="-1">Wallison Araujo</text>
  <rect x="442" y="82" width="136" height="32" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="510" y="103" text-anchor="middle" fill="#38bdf8" font-family="Consolas, monospace" font-size="15" font-weight="700">@WallisonWS</text>

  <text x="56" y="152" fill="#cbd5e1" font-family="Segoe UI, -apple-system, system-ui, sans-serif" font-size="20" font-weight="600">Software Engineer  •  DevSecOps  •  Network &amp; Zero-Trust Architect</text>
  <text x="56" y="182" fill="#94a3b8" font-family="Segoe UI, -apple-system, system-ui, sans-serif" font-size="15">Building 100% open-source, privacy-first tools for Developers, SOC Analysts &amp; SysAdmins.</text>

  <!-- Feature Pills -->
  <g font-family="Segoe UI, system-ui, sans-serif" font-size="12.5" font-weight="700">
    <rect x="56" y="204" width="178" height="30" rx="8" fill="#0c4a6e" fill-opacity="0.55" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="145" y="224" text-anchor="middle" fill="#7dd3fc">⚡ 12-in-1 DevSecOps Web</text>

    <rect x="246" y="204" width="178" height="30" rx="8" fill="#064e3b" fill-opacity="0.55" stroke="#10b981" stroke-opacity="0.5"/>
    <text x="335" y="224" text-anchor="middle" fill="#6ee7b7">🛡️ Zero-Trust Firewalls</text>

    <rect x="436" y="204" width="194" height="30" rx="8" fill="#312e81" fill-opacity="0.55" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="533" y="224" text-anchor="middle" fill="#c7d2fe">📱 Web, Mobile &amp; Cloud CLI</text>
  </g>

  <!-- Terminal Prompt Bar -->
  <rect x="56" y="252" width="730" height="40" rx="10" fill="#050810" stroke="#1e293b" stroke-width="1.2"/>
  <text x="74" y="277" fill="#10b981" font-family="Consolas, 'Fira Code', monospace" font-size="14" font-weight="700">$</text>
  <text x="92" y="277" fill="#e2e8f0" font-family="Consolas, 'Fira Code', monospace" font-size="13.5">npx / python / pwsh --explore "github.com/WallisonWS" --zero-trust</text>
  <rect class="blink" x="634" y="263" width="9" height="18" rx="2" fill="#38bdf8"/>

  <!-- Right Emblem: Floating Cyber Shield + Code Vector -->
  <g class="floatShield" transform="translate(915, 76)">
    <circle cx="115" cy="105" r="96" fill="#0ea5e9" fill-opacity="0.07" stroke="#38bdf8" stroke-opacity="0.25" stroke-dasharray="6 6"/>
    <circle cx="115" cy="105" r="74" fill="#6366f1" fill-opacity="0.09" stroke="#818cf8" stroke-opacity="0.35"/>
    <!-- Shield Shape -->
    <path d="M 115 38 L 170 60 L 170 112 C 170 148 146 173 115 186 C 84 173 60 148 60 112 L 60 60 Z"
          fill="#0b1326" stroke="url(#shieldGrad)" stroke-width="3.5"/>
    <!-- Inner Code Brackets </> -->
    <path d="M 96 95 L 82 108 L 96 121" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 134 95 L 148 108 L 134 121" fill="none" stroke="#818cf8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="121" y1="88" x2="109" y2="128" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>
    <!-- Orbiting Accent Nodes -->
    <circle cx="32" cy="72" r="5" fill="#38bdf8"/>
    <circle cx="198" cy="138" r="5" fill="#10b981"/>
    <circle cx="182" cy="48" r="4" fill="#a855f7"/>
  </g>
</svg>
